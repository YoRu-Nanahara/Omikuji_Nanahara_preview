<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/png" href="images/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nanahara Shrine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading 保持獨立，不縮放 -->
  <div id="loadingScreen">
    <img src="images/loading-bg.jpg" class="loading-bg">
    <img src="images/loading-sakura.png" class="loading-sakura">
    <div id="loadingText">Loading... 0%</div>
  </div>

  <!-- 這個是「螢幕容器」：負責置中 + 黑邊 -->
  <div id="viewport">
    <!-- 這個是「設計舞台」：固定 1080x1920，只做 scale -->
    <div id="gameRoot">

      <!-- 櫻花粒子：跟著舞台縮放 -->
      <canvas id="sakura"></canvas>

      <!-- 拉門：跟著舞台縮放 -->
      <div id="transitionDoors">
        <img src="images/door-left.jpg" class="door left" alt="">
        <img src="images/door-right.jpg" class="door right" alt="">
      </div>

  <!-- 你的 modal 可以留 fixed（它要覆蓋整個 viewport） -->
        <div id="resultModal">
          <div class="modalContent">
            <img id="resultImage" alt="你的御神籤結果">
            <div class="modalButtons">
              <img id="shareBtn" src="images/share-btn.png" alt="">
              <img id="saveBtn" src="images/save-btn.png" alt="">
              <img id="closeModal" src="images/close-btn.png" alt="">
            </div>
            
          </div>
        </div>

      <!-- Menu：跟著舞台縮放 -->
<div id="menuScreen" class="screen hidden">
  <div class="menu-background day"></div>
  <div class="menu-background night"></div>

  <div class="menu-content">
    <div class="menu-buttons">
      <button id="btnOmikuji" class="menu-btn">
        <img src="images/menu-btn-omikuji.png" alt="">
      </button>

      <button id="btnOmamori" class="menu-btn">
  <img src="images/menu-btn-omamori.png" alt="">
</button>

<button id="btnGarden" class="menu-btn menu-btn-garden" type="button">
  <img src="images/menu-btn-garden.png" alt="Garden">
</button>

<button id="btnMission" class="menu-btn menu-btn-mission" type="button">
  <img src="images/menu-btn-mission.png" alt="Mission">
</button>

    </div>

       <!-- LOGO：放在 buttons 外面，定位才乾淨 -->
    <div id="menuLogo">
      <img src="images/nanahara-logo.png" alt="Nanahara Shrine Logo">
    </div>

  </div>
</div> <!-- /menuScreen -->


<!-- Garden：庭園畫面 -->
<div id="gardenScreen" class="screen hidden">
  <button id="btnGardenMenu" class="ui-btn-menu-topright" type="button" aria-label="Back to Menu">
    <img src="images/ui-btn-menu.png" alt="Back to Menu">
  </button>

  <div id="gardenScene">
    <!-- 背景底圖 -->
    <img
      class="garden-layer garden-bg"
      src="images/garden/courtyard/courtyard-bg-day.jpg"
      alt=""
    >

    <!-- 遠景場景圖層：不是遮擋物 -->
    <img
      class="garden-layer garden-fg-far-area"
      src="images/garden/courtyard/courtyard-fg-far-area.png"
      alt=""
    >

    <!-- 遠景角色層 -->
    <div id="gardenCharFarLayer" class="garden-character-layer"></div>

    <!-- 建築遮擋圖層：遮住 far layer 的角色 -->
    <img
      class="garden-layer garden-fg-building-occluder"
      src="images/garden/courtyard/courtyard-fg-building-occluder.png"
      alt=""
    >

    <!-- 建築走廊前緣 -->
    <img
      class="garden-layer garden-fg-building-front-edge"
      src="images/garden/courtyard/courtyard-fg-building-front-edge.png"
      alt=""
    >

    <!-- 一般角色層：千冬、千夏初始都放這裡 -->
    <div id="gardenCharNormalLayer" class="garden-character-layer">
      <div id="chifuyuWalkTestWrap">
        <div id="chifuyuWalkShadow"></div>
        <div id="chifuyuWalkTest" class="chifuyu-idle-sheet"></div>
      </div>

      <div id="chinatsuWalkTestWrap">
        <div id="chinatsuWalkShadow"></div>
        <div id="chinatsuWalkTest" class="chinatsu-idle-sheet"></div>
      </div>
    </div>

    <!-- 前景角色層：y > 1400 時用 -->
    <div id="gardenCharFrontLayer" class="garden-character-layer"></div>

    <!-- 枯山水前緣 -->
    <img
      class="garden-layer garden-obj-karesansui-front"
      src="images/garden/courtyard/courtyard-obj-karesansui-front.png"
      alt=""
    >

    <!-- 左下燈籠 -->
    <img
      class="garden-layer garden-fg-lantern-left"
      src="images/garden/courtyard/courtyard-fg-lantern-left.png"
      alt=""
    >

    <!-- 右上建築轉角 -->
    <img
      class="garden-layer garden-fg-building-corner"
      src="images/garden/courtyard/courtyard-fg-building-corner.png"
      alt=""
    >

    <!-- 右上轉角前方角色層 -->
    <div id="gardenCharCornerFrontLayer" class="garden-character-layer"></div>

    <!-- 左上櫻花前景 -->
    <img
      class="garden-layer garden-fg-sakura-top"
      src="images/garden/courtyard/courtyard-fg-sakura-top.png"
      alt=""
    >

    <!-- Debug canvas：只保留一個，而且放最後 -->
    <canvas id="gardenWalkDebugCanvas" width="1080" height="1920"></canvas>
  </div>
</div> <!-- /gardenScreen -->


      <!-- Omikuji：也放進同一舞台 -->
      <div id="omikujiScreen" class="screen hidden">

        <!-- Omikuji Screen 內，任意位置都可（建議放在最底下結尾處） -->
<button id="btnOmikujiMenu" class="ui-btn-menu-topright" type="button" aria-label="Back to Menu">
  <img src="images/ui-btn-menu.png" alt="Back to Menu">
</button>

        
        <!-- introScreen：如果你要它跟舞台縮放，就留在舞台內 -->
        <div id="introScreen">
          <img src="images/guide-bg.jpg" class="intro-bg" alt="">

          <div id="introText">
            <div>Welcome to Nanahara Shrine!</div>
            <div>To celebrate Nanahara sisters' birthday, we are gathering blessings from </div>
            <div>all around the world.</div>
            <div>Tap the birthday card below to send your wishes...</div>
            <div>Come and see what luck awaits you today!</div>
          </div>

          <div id="blessingWrapper">
            <img id="blessingCard" src="images/Card.png" alt="">
          </div>
        </div>

        <!-- 抽籤畫面元素（保持你原本定位） -->
        <img src="images/bg.jpg" class="bg day" crossorigin="anonymous">
        <img src="images/bg-night.jpg" class="bg night" crossorigin="anonymous">

        <img src="images/characters.png" class="characters day" crossorigin="anonymous">
        <img src="images/characters-night.png" class="characters night" crossorigin="anonymous">

        <img id="omikuji" class="omikuji" src="images/omikuji1.png" crossorigin="anonymous">
        <img src="images/draw-btn.png" id="drawBtn" class="draw-btn" crossorigin="anonymous">
      </div>

<div id="omamoriScreen" class="screen hidden">
  
  <button id="btnOmamoriMenu" class="ui-btn-menu-topright" type="button" aria-label="Back to Menu">
  <img src="images/ui-btn-menu.png" alt="Back to Menu">
</button>

  <!-- 背景 -->
  <img src="images/omamori-bg.jpg" class="omamori-bg" alt="">

  <!-- ✅ (1) 只包御守本體：完成後彈跳掛在這層 -->
  <div id="omamoriPreviewWrap">
    <div id="omamoriPreview">
   <!-- ✅ 新增：聚焦發光層（只做疊加，不吃點擊） -->
    <div id="omamoriGlowLayer" aria-hidden="true"></div>

      <div id="wrapOmamoriTop" class="omamori-part-wrap">
        <img id="omamoriTop" class="omamori-part top" src="images/omamori-top-01.png" alt="">
      </div>

      <div id="wrapOmamoriBottom" class="omamori-part-wrap">
        <img id="omamoriBottom" class="omamori-part bottom" src="images/omamori-bottom-01.png" alt="">
      </div>

      <div id="wrapOmamoriKnot" class="omamori-part-wrap">
        <img id="omamoriKnot" class="omamori-part knot" src="images/omamori-knot-01.png" alt="">
      </div>

    </div>
  </div>

  <!-- ✅ (2) Perfect（在 wrapper 外面） -->
  <img id="omamoriPerfect" src="images/omamori-perfect.png" alt="Perfect!">

  <!-- ✅ (3) 完成聚焦後按鈕列（在 wrapper 外面） -->
  <div id="omamoriFocusActions" class="hidden">
    <button id="btnFocusMenu" class="focus-btn" type="button">
      <img src="images/ui-btn-menu.png" alt="回到Menu">
    </button>

    <button id="btnFocusBackToEdit" class="focus-btn" type="button">
      <img src="images/ui-btn-back.png" alt="返回御守製作">
    </button>

    <button id="btnFocusCapture" class="focus-btn" type="button">
      <img src="images/ui-btn-capture.png" alt="截圖">
    </button>
  </div>

  <!-- ✅ (4) 角色與對話框（在 wrapper 外面） -->
  <div id="omamoriDialogue">
    <div class="npc left">
      <div class="npc-breathe">
        <img id="omamoriCharLeft" class="npc-img" src="images/omamori-characters-left-01.png" alt="">
      </div>
      <div class="bubble">
        <img class="bubble-img" src="images/omamori-speech-left.png" alt="">
        <div id="omamoriLineLeft" class="bubble-text"></div>
      </div>
    </div>

    <div class="npc right">
      <div class="npc-breathe">
        <img id="omamoriCharRight" class="npc-img" src="images/omamori-characters-right-01.png" alt="">
      </div>
      <div class="bubble">
        <img class="bubble-img" src="images/omamori-speech-right.png" alt="">
        <div id="omamoriLineRight" class="bubble-text"></div>
      </div>
    </div>
  </div>

  <!-- ✅ (5) 左右切換按鈕（在 wrapper 外面） -->
  <button id="btnKnotLeft" class="omamori-arrow left row-knot">
    <img src="images/omamori-arrow-knot-left.png" alt="">
  </button>
  <button id="btnKnotRight" class="omamori-arrow right row-knot">
    <img src="images/omamori-arrow-knot-right.png" alt="">
  </button>

  <button id="btnTopLeft" class="omamori-arrow left row-top">
    <img src="images/omamori-arrow-top-left.png" alt="">
  </button>
  <button id="btnTopRight" class="omamori-arrow right row-top">
    <img src="images/omamori-arrow-top-right.png" alt="">
  </button>

  <button id="btnBottomLeft" class="omamori-arrow left row-bottom">
    <img src="images/omamori-arrow-bottom-left.png" alt="">
  </button>
  <button id="btnBottomRight" class="omamori-arrow right row-bottom">
    <img src="images/omamori-arrow-bottom-right.png" alt="">
  </button>

  <!-- ✅ (6) 完成按鈕（在 wrapper 外面，才能點） -->
  <button id="btnOmamoriFinish" class="omamori-finish">
    <img src="images/omamori-btn-finish.png" alt="">
  </button>
    </div> <!-- /omamoriScreen -->

  <div id="windGameScreen" class="screen hidden">
  <img id="windGameBg" class="wind-game-bg" src="" alt="Nanahara Wind Flight Background">


  <!-- Wind Game Obstacles -->
<div id="windObstacleGroup">
  <img id="windObstacleTop" class="wind-obstacle wind-obstacle-top" src="images/wind-obstacle-top.png" alt="">
  <img id="windObstacleBottom" class="wind-obstacle wind-obstacle-bottom" src="images/wind-obstacle-bottom.png" alt="">
</div>

<div id="windSakuraTrail"></div>
<div id="windGoldRoute"></div>
<div id="windSakuraBonus"></div>
<div id="windBonusGold"></div>

<img id="windGhost" class="wind-ghost hidden" src="images/wind-ghost.png" alt="">
<img id="windGhostRush" class="wind-ghost-rush hidden" src="images/wind-ghost-rush.png" alt="">
<img id="windGhostPhase" class="wind-ghost-phase hidden" src="images/wind-ghost-phase.png" alt="">
  <!-- Wind Game Player：紙鶴 + 千夏 + 千冬 -->
  <div id="windPlayer">
  
    <img id="windCrane" class="wind-player-layer" src="images/wind-crane.png" alt="">
    <img id="windChinatsu" class="wind-player-layer" src="images/wind-chinatsu-down.png" alt="">
    <img id="windChifuyu" class="wind-player-layer" src="images/wind-chifuyu-idle.png" alt="">
    <img id="windSlash" class="wind-player-slash hidden" src="images/wind-slash.png" alt="">
  </div>

  <div id="windCountdown" class="hidden" aria-live="polite"></div>
<div id="windScore">0</div>

<div id="windPauseOverlay" class="wind-pause-overlay hidden" aria-live="polite">
  <div class="wind-pause-title">- Pause -</div>
</div>

<div id="windResultPanel" class="wind-result-panel hidden" aria-live="polite">
  <div class="wind-result-card wind-result-image-card">
    <img
      id="windResultImage"
      class="wind-result-image"
      src="images/wind-result-crash.png"
      alt="Mission Complete"
    >

    <div class="wind-result-score-overlay">
      <div class="wind-result-score-row">
        <span>Score</span>
        <strong id="windResultScore">0</strong>
      </div>

      <div class="wind-result-score-row wind-result-best">
        <span>Best</span>
        <strong id="windResultBest">0</strong>
      </div>
    </div>

    <div class="wind-result-actions wind-result-icon-actions">
      <button id="btnWindRetry" class="focus-btn wind-result-icon-btn" type="button" aria-label="Retry">
        <img src="images/ui-btn-back.png" alt="Retry">
      </button>

      <button id="btnWindResultMenu" class="focus-btn wind-result-icon-btn" type="button" aria-label="Back to Menu">
        <img src="images/ui-btn-menu.png" alt="Menu">
      </button>
    </div>
  </div>
</div>

<div id="windHitboxLayer"></div>

<div id="windControls">
    <button id="btnWindAttack" class="wind-control-btn wind-attack-btn" type="button" aria-label="Attack">
      <img src="images/wind-btn-attack.png" alt="Attack">
    </button>

    <button id="btnWindFly" class="wind-control-btn wind-fly-btn" type="button" aria-label="Fly">
      <img src="images/wind-btn-fly.png" alt="Fly">
    </button>
  </div>
  <button id="btnWindGameMenu" class="ui-btn-menu-topright" type="button" aria-label="Pause">
  <img src="images/ui-btn-pause.png" alt="Pause">
</button>
</div>

  </div>   <!-- /gameRoot -->
</div>     <!-- /viewport -->
 

  <!-- 音效 -->
<!-- 音效 -->
<audio id="bgm" src="audio/bgm.mp3" loop></audio>
<audio id="drawSound" src="audio/draw.mp3" preload="auto"></audio>

<!-- Wind Game 音效 -->
<audio id="windGameBgm" src="audio/wind-bgm.mp3" loop preload="auto"></audio>
<audio id="windSlashSound" src="audio/wind-slash-se.wav" preload="auto"></audio>

<!-- ✅ Omamori 截圖舞台：只用來生成圖片，不干擾主畫面 -->
<div id="omamoriCaptureStage" class="capture-hidden" aria-hidden="true">
  <img id="omamoriCaptureBg" src="images/omamori-final.jpg" alt="">
  <div id="omamoriCaptureOmamori">
    <img id="capTop" alt="">
    <img id="capBottom" alt="">
    <img id="capKnot" alt="">
  </div>
</div>

</body>
</html>
